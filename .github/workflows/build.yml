name: Build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        preset: [core, sanitize]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} --timeout 600
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev xvfb
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: ctest --preset release --timeout 120
      - name: Verify desktop input and workflow
        run: |
          xvfb-run -a ./build/material_lab --ui-test
          xvfb-run -a ./build/material_lab --workflow-test
